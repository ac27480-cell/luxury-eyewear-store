<w!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Eyewear Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 text-center">
    <!-- Platzhalter für Produktbild -->
    <div class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center mb-6">
      <span class="text-gray-400 font-light tracking-widest uppercase">Brillenbild</span>
    </div>

    <!-- Produktinformationen -->
    <h1 class="text-2xl font-light text-gray-900 mb-2">Cartier Signature</h1>
    <p class="text-gray-500 mb-6 font-light">Exquisite Luxusbrille</p>
    
    <!-- Store Locator / Verfügbarkeitsanzeige -->
    <div class="border-t pt-4 text-left space-y-3">
      <h2 class="text-lg font-medium text-gray-900">Verfügbarkeit im Store:</h2>
      
      <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
        <div>
          <p class="font-medium text-sm">Optik Flensburg</p>
          <p class="text-xs text-gray-500">Flensburg</p>
        </div>
        <span class="px-2 py-1 text-xs font-semibold bg-green-100 text-green-800 rounded-full">3 auf Lager</span>
      </div>

      <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
        <div>
          <p class="font-medium text-sm">Optik Hamburg</p>
          <p class="text-xs text-gray-500">Hamburg</p>
        </div>
        <span class="px-2 py-1 text-xs font-semibold bg-red-100 text-red-800 rounded-full">Nicht verfügbar</span>
      </div>

      <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
        <div>
          <p class="font-medium text-sm">Optik Berlin</p>
          <p class="text-xs text-gray-500">Berlin</p>
        </div>
        <span class="px-2 py-1 text-xs font-semibold bg-green-100 text-green-800 rounded-full">1 auf Lager</span>
      </div>
    </div>
  </div>

</body>
</html>
